<!DOCTYPE html>
<html lang="ru" class="bg-transparent">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Фокусировка</title>
  <!-- Tailwind CSS v4 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  
  <style>
    /* Tahoma - The exact Windows XP system font */
    body {
      font-family: Tahoma, 'MS Sans Serif', Geneva, sans-serif;
    }
    
    /* Electron Drag Utilities */
    .drag-region {
      -webkit-app-region: drag;
    }
    .no-drag {
      -webkit-app-region: no-drag;
    }

    /* Windows XP styled scrollbar */
    .cozy-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .cozy-scrollbar::-webkit-scrollbar-track {
      background: #ECE9D8;
    }
    .cozy-scrollbar::-webkit-scrollbar-thumb {
      background: #245DDA;
      border: 1px solid #003C74;
      border-radius: 2px;
    }
    .cozy-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #3D7BF5;
    }

    /* Classic 3D Windows XP Button Style */
    .xp-btn {
      background: linear-gradient(to bottom, #FFFFFF 0%, #F5F5EC 40%, #EAEAE0 100%);
      border: 1px solid #003C74;
      border-radius: 3px;
      box-shadow: inset 1px 1px 0 #ffffff;
      color: #003C74;
      font-family: Tahoma, sans-serif;
      font-weight: bold;
      transition: all 0.1s ease;
    }
    .xp-btn:hover {
      background: linear-gradient(to bottom, #FFFFFF 0%, #FAF0E6 40%, #EFE5D9 100%);
      border-color: #003C74;
    }
    .xp-btn:active {
      background: #EAEAE0;
      box-shadow: inset 1px 1px 1px rgba(0, 0, 0, 0.15);
      transform: translateY(0.5px);
    }

    /* Custom Styling for Range Opacity Slider (Classic XP Blue Track) */
    input[type="range"]::-webkit-slider-runnable-track {
      background: #ffffff;
      height: 4px;
      border-radius: 2px;
      border: 1px solid #7F9DB9;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      background: linear-gradient(to bottom, #FFFFFF 0%, #EAEAE0 100%);
      width: 12px;
      height: 12px;
      border-radius: 3px;
      margin-top: -5px;
      box-shadow: inset 1px 1px 0 #fff;
      border: 1px solid #003C74;
    }
    input[type="range"]::-webkit-slider-thumb:hover {
      background: linear-gradient(to bottom, #FFFFFF 0%, #FAF0E6 100%);
    }

    /* Compact Focus Mode (Pomodoro Timer Running) CSS Overrides */
    .compact-mode .hidden-in-compact {
      display: none !important;
    }
    .compact-mode #active-task-container > div {
      min-height: auto !important;
    }
    .compact-mode #active-task-container p {
      font-size: 11px !important;
      line-height: 1.3 !important;
    }
    .compact-mode #active-task-container .mt-3 {
      margin-top: 8px !important; /* tighten margins in compact mode */
    }
    .compact-mode header {
      margin-bottom: 0px !important;
    }

    /* User Compact View Mode CSS Overrides */
    .compact-view .hidden-in-compact-view {
      display: none !important;
    }
    .compact-view #widget-shell {
      justify-content: flex-start !important;
    }
    .compact-view #parallel-tasks-container {
      max-height: 75px !important;
    }
    .compact-view #active-task-container > div {
      min-height: auto !important;
    }
    .compact-view #active-task-container .mt-4 {
      margin-top: 8px !important;
    }
  </style>
</head>
<body class="bg-transparent text-black h-screen w-screen flex items-center justify-center p-2 select-none overflow-hidden selection:bg-[#3D7BF5] selection:text-white">

  <!-- Main XP Luna Shell - Draggable Region (Classic Sand-Beige Body) -->
  <div id="widget-shell" class="drag-region w-[294px] h-full bg-[#ECE9D8] rounded-t-[8px] rounded-b-[4px] border-[3px] border-[#0054E3] flex flex-col justify-between relative overflow-hidden shadow-none cursor-default p-0">

    <div class="flex flex-col flex-grow">
      
      <!-- Upper Header Bar - Draggable Region (XP Royal Blue Title Bar) -->
      <header class="drag-region bg-gradient-to-r from-[#0058E3] via-[#0A65EB] to-[#2787F7] h-[30px] flex items-center justify-between px-2 select-none shrink-0 relative cursor-move">
        <!-- Title Highlight Line -->
        <div class="absolute top-0 left-0 right-0 h-[1.5px] bg-[#6698FF] opacity-80 pointer-events-none"></div>
        
        <div>
          <h1 class="text-white font-bold text-[11px] tracking-wide select-none drop-shadow-[1px_1px_0_rgba(0,0,0,0.5)]">Фокусировка</h1>
        </div>
        
        <!-- Native Desktop Window Controls (XP Classic Buttons) -->
        <div class="flex items-center gap-1.5 no-drag ml-auto">
          <!-- Toggle Compact View Button (Green) -->
          <button 
            id="compact-toggle-btn"
            onclick="toggleCompactView()" 
            class="btn-scale w-[21px] h-[21px] rounded-[3px] bg-gradient-to-b from-[#54D554] to-[#269E26] border border-[#146614] hover:border-[#7CFC00] flex items-center justify-center text-[10px] text-white font-bold transition-all cursor-pointer hidden-in-compact animate-none" 
            style="box-shadow: inset 1px 1px 0 rgba(255,255,255,0.4);"
            title="Свернуть в компактный вид"
          >
            ⤡
          </button>
          
          <!-- Timer Expand/Collapse Button (Green) - Visible only when timer is running -->
          <button 
            id="timer-expand-btn"
            onclick="toggleTimerExpansion()" 
            class="btn-scale w-[21px] h-[21px] rounded-[3px] bg-gradient-to-b from-[#54D554] to-[#269E26] border border-[#146614] hover:border-[#7CFC00] flex items-center justify-center text-[10px] text-white font-bold cursor-pointer hidden animate-none" 
            style="box-shadow: inset 1px 1px 0 rgba(255,255,255,0.4);"
            title="Развернуть интерфейс"
          >
            ⤢
          </button>
          
          <!-- Minimize Button (Blue) -->
          <button 
            onclick="window.windowControls.minimize()" 
            class="btn-scale w-[21px] h-[21px] rounded-[3px] bg-gradient-to-b from-[#4A8EF8] to-[#125CE3] border border-[#0A3D9A] hover:border-[#6699FF] flex items-center justify-center text-[10px] text-white font-bold transition-all cursor-pointer animate-none" 
            style="box-shadow: inset 1px 1px 0 rgba(255,255,255,0.4);"
            title="Свернуть"
          >
            —
          </button>
          
          <!-- Close Button (Red) -->
          <button 
            onclick="window.windowControls.close()" 
            class="btn-scale w-[21px] h-[21px] rounded-[3px] bg-gradient-to-b from-[#E76C55] to-[#C7381F] border border-[#8B2411] hover:border-[#FF9999] flex items-center justify-center text-[11px] text-white font-bold transition-all cursor-pointer animate-none" 
            style="box-shadow: inset 1px 1px 0 rgba(255,255,255,0.5);"
            title="Закрыть"
          >
            ✕
          </button>
        </div>
      </header>

      <!-- Inner Content Area with standard XP sand padding -->
      <div class="p-3.5 flex flex-col flex-grow">
        
        <!-- Active Focus Block (Current Focus) - Draggable Background -->
        <section class="mb-2">
          <div id="active-task-container" class="">
            <!-- Rendered dynamically -->
          </div>
        </section>

        <!-- Task Input Form -->
        <section class="mb-3.5 no-drag hidden-in-compact hidden-in-compact-view">
          <form id="task-form" onsubmit="handleFormSubmit(event)" class="relative flex items-center border border-[#7F9DB9] bg-white p-0.5 rounded-[2px] transition-colors">
            <input 
              type="text" 
              id="task-input" 
              placeholder="Каков следующий фокус?..." 
              maxlength="120"
              required
              class="w-full bg-transparent text-black text-center text-xs focus:outline-none transition-all placeholder-[#919B9C] shadow-none border-none py-1 font-semibold"
            >
          </form>
        </section>

        <!-- Parallel Tasks Block -->
        <section class="mb-1 flex-grow flex flex-col justify-end hidden-in-compact">
          <div class="flex items-center justify-between mb-2 select-none border-b border-[#D2D2C9] pb-1">
            <h2 class="text-[10px] font-bold text-[#003C74] tracking-wide uppercase">Очередь</h2>
            <span id="parallel-count" class="text-[9px] font-bold text-[#003C74] bg-white border border-[#7F9DB9] px-1.5 py-0.2 rounded-[2px] select-none">0</span>
          </div>
          <div id="parallel-tasks-container" class="no-drag max-h-[90px] overflow-y-auto cozy-scrollbar pr-0.5 space-y-1">
            <!-- Rendered dynamically -->
          </div>
        </section>

      </div>

    </div>

    <!-- History & Settings Block (Collapsible XP Explorer Sidebar Panel style!) -->
    <footer class="no-drag shrink-0 hidden-in-compact hidden-in-compact-view">
      <details class="group border-t border-[#003C74]" id="history-details">
        <summary class="flex items-center justify-center gap-1 cursor-pointer list-none select-none bg-[#245DDA] hover:bg-[#3D7BF5] text-white py-1.5 transition-colors">
          <span class="text-[10px] font-bold uppercase tracking-wider">Опции & Архив</span>
          <span id="history-count" class="text-[8px] font-bold px-1 rounded-full bg-white text-[#245DDA] select-none">0</span>
        </summary>
        
        <!-- Light blue XP Explorer-style sidebar body -->
        <div class="bg-[#D6E3F7] p-3 border-t border-[#003C74] space-y-2.5">
          <!-- Opacity Settings Control -->
          <div class="flex items-center justify-between px-0.5 select-none">
            <span class="text-[10px] font-bold text-[#003C74] uppercase tracking-wider">Прозрачность</span>
            <div class="flex items-center gap-2">
              <input 
                type="range" 
                id="opacity-slider" 
                min="35" 
                max="100" 
                value="85" 
                oninput="adjustOpacity(this.value)"
                class="w-16 h-3 bg-transparent appearance-none cursor-pointer no-drag animate-none"
              >
              <span id="opacity-value" class="w-6 text-right text-[9px] font-bold text-[#003C74]">85%</span>
            </div>
          </div>
          
          <!-- Pomodoro Timer Settings Control -->
          <div class="flex items-center justify-between px-0.5 select-none">
            <span class="text-[10px] font-bold text-[#003C74] uppercase tracking-wider">Таймер Pomodoro (мин)</span>
            <input 
              type="number" 
              id="timer-duration-input" 
              min="1" 
              max="120" 
              value="25" 
              onchange="updateTimerDuration(this.value)"
              class="w-8 text-right text-[10px] font-bold text-[#003C74] bg-white border border-[#7F9DB9] rounded-[2px] focus:outline-none no-drag font-mono"
            >
          </div>
          
          <div class="border-t border-[#7F9DB9]/60 my-1.5"></div>

          <!-- Completed History List -->
          <div id="history-list" class="max-h-[55px] overflow-y-auto cozy-scrollbar pr-0.5 space-y-0.5">
            <!-- Rendered dynamically -->
          </div>
        </div>
      </details>
    </footer>

    <!-- Notepad Modal Overlay (Hidden by default) -->
    <div id="notes-modal" class="absolute inset-0 bg-black/40 z-50 flex items-center justify-center p-3 hidden no-drag">
      <!-- XP Window (Dialog Box Style) -->
      <div class="w-full max-w-[260px] bg-[#ECE9D8] rounded-t-[5px] rounded-b-[3px] border-2 border-[#0054E3] flex flex-col shadow-lg">
        <!-- Modal Header (Blue Title Bar) -->
        <div class="bg-gradient-to-r from-[#0058E3] via-[#0A65EB] to-[#2787F7] h-[24px] flex items-center justify-between px-2 select-none shrink-0 relative">
          <div class="absolute top-0 left-0 right-0 h-[1.5px] bg-[#6698FF] opacity-80 pointer-events-none"></div>
          <span class="text-white font-bold text-[10px] tracking-wide drop-shadow-[1px_1px_0_rgba(0,0,0,0.5)]">Блокнот XP</span>
          <!-- Mini Close Button -->
          <button onclick="closeNotesModal(false)" class="w-[15px] h-[15px] rounded-[2px] bg-gradient-to-b from-[#E76C55] to-[#C7381F] border border-[#8B2411] flex items-center justify-center text-[9px] text-white font-bold cursor-pointer hover:border-[#FF9999]">✕</button>
        </div>
        <!-- Modal Body -->
        <div class="p-2.5 flex flex-col gap-2">
          <div class="text-[10px] font-bold text-[#003C74] truncate font-sans" id="notes-modal-task-title">Задача: ...</div>
          
          <!-- Text Area (Sunken 3D border, standard Notepad styling) -->
          <textarea 
            id="notes-textarea" 
            rows="5" 
            placeholder="Введите заметки к задаче здесь..."
            class="w-full text-xs p-1.5 focus:outline-none resize-none font-mono text-black bg-white cozy-scrollbar rounded-[2px] no-drag select-text overflow-y-auto"
            style="border: 2px solid #7F9DB9; box-shadow: inset 1.5px 1.5px 2px rgba(0,0,0,0.15);"
          ></textarea>
          
          <!-- XP Dialog Buttons -->
          <div class="flex items-center justify-end gap-2 mt-1">
            <button onclick="saveNotes()" class="btn-scale xp-btn text-[10px] px-4 py-1.5 cursor-pointer no-drag" style="min-width: 55px;">ОК</button>
            <button onclick="closeNotesModal(false)" class="btn-scale xp-btn text-[10px] px-3 py-1.5 cursor-pointer no-drag" style="min-width: 55px;">Отмена</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Edit Task Modal Overlay (Hidden by default) -->
    <div id="edit-modal" class="absolute inset-0 bg-black/40 z-50 flex items-center justify-center p-3 hidden no-drag">
      <!-- XP Window (Dialog Box Style) -->
      <div class="w-full max-w-[260px] bg-[#ECE9D8] rounded-t-[5px] rounded-b-[3px] border-2 border-[#0054E3] flex flex-col shadow-lg">
        <!-- Modal Header (Blue Title Bar) -->
        <div class="bg-gradient-to-r from-[#0058E3] via-[#0A65EB] to-[#2787F7] h-[24px] flex items-center justify-between px-2 select-none shrink-0 relative">
          <div class="absolute top-0 left-0 right-0 h-[1.5px] bg-[#6698FF] opacity-80 pointer-events-none"></div>
          <span class="text-white font-bold text-[10px] tracking-wide drop-shadow-[1px_1px_0_rgba(0,0,0,0.5)]">Свойства задачи</span>
          <!-- Mini Close Button -->
          <button onclick="closeEditModal(false)" class="w-[15px] h-[15px] rounded-[2px] bg-gradient-to-b from-[#E76C55] to-[#C7381F] border border-[#8B2411] flex items-center justify-center text-[9px] text-white font-bold cursor-pointer hover:border-[#FF9999]">✕</button>
        </div>
        <!-- Modal Body -->
        <div class="p-2.5 flex flex-col gap-2">
          <div class="text-[10px] font-bold text-[#003C74] font-sans">Редактирование формулировки:</div>
          
          <!-- Input Field (Sunken 3D border, standard input styling) -->
          <input 
            type="text"
            id="edit-task-input" 
            maxlength="120"
            class="w-full text-xs p-1.5 focus:outline-none text-black bg-white rounded-[2px] no-drag select-text font-semibold"
            style="border: 2px solid #7F9DB9; box-shadow: inset 1.5px 1.5px 2px rgba(0,0,0,0.15);"
          >
          
          <!-- XP Dialog Buttons -->
          <div class="flex items-center justify-end gap-2 mt-1">
            <button onclick="saveTaskEdit()" class="btn-scale xp-btn text-[10px] px-4 py-1.5 cursor-pointer no-drag" style="min-width: 55px;">ОК</button>
            <button onclick="closeEditModal(false)" class="btn-scale xp-btn text-[10px] px-3 py-1.5 cursor-pointer no-drag" style="min-width: 55px;">Отмена</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- Reactive Logic Script -->
  <script>
    // State definition
    const state = {
      activeTask: null,
      parallelTasks: [],
      history: []
    };

    // Pomodoro Timer State
    const pomodoro = {
      durationMinutes: 25,
      timeLeft: 1500,
      isRunning: false,
      intervalId: null,
      endTime: 0,
      isExpanded: false
    };

    // Compact View Mode ViewState
    const viewState = {
      isCompactView: false
    };

    // Notepad Modal global state
    let currentEditingTaskId = null;

    // Load state from localStorage on init
    function loadState() {
      try {
        const saved = localStorage.getItem('focus_logbook_state');
        if (saved) {
          const parsed = JSON.parse(saved);
          state.activeTask = parsed.activeTask || null;
          state.parallelTasks = parsed.parallelTasks || [];
          state.history = parsed.history || [];
        }
      } catch (e) {
        console.error('Failed to load state from localStorage', e);
      }
    }

    // Save state to localStorage
    function saveState() {
      try {
        localStorage.setItem('focus_logbook_state', JSON.stringify(state));
      } catch (e) {
        console.error('Failed to save state to localStorage', e);
      }
    }

    // Helper: secure escape for HTML strings
    function escapeHTML(str) {
      if (!str) return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Helper: format timestamp for display
    function formatTime(isoString) {
      if (!isoString) return '';
      const d = new Date(isoString);
      const hours = String(d.getHours()).padStart(2, '0');
      const minutes = String(d.getMinutes()).padStart(2, '0');
      return `${hours}:${minutes}`;
    }

    // Dynamic Opacity Controller
    window.adjustOpacity = function(val) {
      const shell = document.getElementById('widget-shell');
      if (shell) {
        shell.style.opacity = val / 100;
      }
      const valEl = document.getElementById('opacity-value');
      if (valEl) {
        valEl.textContent = val + '%';
      }
      try {
        localStorage.setItem('focus_logbook_opacity', val);
      } catch (e) {
        console.error('Failed to save opacity to localStorage', e);
      }
    };

    // --- Compact View Controller ---
    
    function loadViewState() {
      try {
        const saved = localStorage.getItem('focus_logbook_compact_view');
        if (saved) {
          viewState.isCompactView = (saved === 'true');
        }
      } catch (e) {
        console.error('Failed to load view settings', e);
      }
    }

    window.toggleCompactView = function() {
      // Prevent toggling views when Pomodoro is running in collapsed timer mode
      if (pomodoro.isRunning && !pomodoro.isExpanded) return;

      viewState.isCompactView = !viewState.isCompactView;
      try {
        localStorage.setItem('focus_logbook_compact_view', viewState.isCompactView);
      } catch (e) {
        console.error('Failed to save view settings', e);
      }

      // Auto-close history details when entering compact view
      if (viewState.isCompactView) {
        const historyDetails = document.getElementById('history-details');
        if (historyDetails && historyDetails.open) {
          historyDetails.open = false;
        }
      }

      applyCompactView();
    };

    window.applyCompactView = function() {
      const toggleBtn = document.getElementById('compact-toggle-btn');
      if (viewState.isCompactView) {
        document.body.classList.add('compact-view');
        if (toggleBtn) {
          toggleBtn.innerHTML = '⤢';
          toggleBtn.title = "Развернуть форму";
        }
        if (window.windowControls && window.windowControls.setCompactView) {
          window.windowControls.setCompactView();
        }
      } else {
        document.body.classList.remove('compact-view');
        if (toggleBtn) {
          toggleBtn.innerHTML = '⤡';
          toggleBtn.title = "Свернуть в компактный вид";
        }
        if (window.windowControls && window.windowControls.setNormal) {
          window.windowControls.setNormal();
        }
      }
    };

    // --- Pomodoro Timer Functions ---
    
    function loadPomodoroSettings() {
      try {
        const savedDuration = localStorage.getItem('focus_logbook_pomodoro_duration');
        if (savedDuration) {
          pomodoro.durationMinutes = parseInt(savedDuration, 10);
        }
      } catch (e) {
        console.error('Failed to load pomodoro settings', e);
      }
      pomodoro.timeLeft = pomodoro.durationMinutes * 60;
    }

    window.updateTimerDuration = function(val) {
      const minutes = parseInt(val, 10);
      if (isNaN(minutes) || minutes < 1) return;

      pomodoro.durationMinutes = minutes;
      try {
        localStorage.setItem('focus_logbook_pomodoro_duration', minutes);
      } catch (e) {
        console.error('Failed to save pomodoro settings', e);
      }

      if (!pomodoro.isRunning) {
        pomodoro.timeLeft = minutes * 60;
        updateTimerUI();
      }
    };

    window.toggleTimer = function() {
      if (pomodoro.isRunning) {
        // Pause Timer
        pomodoro.isRunning = false;
        pomodoro.isExpanded = false;
        clearInterval(pomodoro.intervalId);
        
        // Return window to normal compact view or normal size
        applyTimerExpansion();
        applyCompactView();
      } else {
        // Start Timer
        pomodoro.isRunning = true;
        pomodoro.isExpanded = false; // Reset to collapsed on start
        // Calculate the exact absolute end timestamp
        pomodoro.endTime = Date.now() + pomodoro.timeLeft * 1000;
        
        // Auto-close history details when entering focus mode
        const historyDetails = document.getElementById('history-details');
        if (historyDetails && historyDetails.open) {
          historyDetails.open = false;
        }

        // Apply expanded or compact timer state
        applyTimerExpansion();

        pomodoro.intervalId = setInterval(() => {
          // Calculate the correct remaining seconds dynamically
          const remainingSeconds = Math.max(0, Math.ceil((pomodoro.endTime - Date.now()) / 1000));
          pomodoro.timeLeft = remainingSeconds;
          
          if (pomodoro.timeLeft <= 0) {
            clearInterval(pomodoro.intervalId);
            pomodoro.isRunning = false;
            pomodoro.isExpanded = false;
            pomodoro.timeLeft = pomodoro.durationMinutes * 60;
            triggerAlert();

            // Return window to compact view or normal size when timer completes
            if (currentEditingTaskId === null) {
              applyTimerExpansion();
              applyCompactView();
            }
          }
          updateTimerUI();
        }, 200); // Poll frequently for smooth updates and precision
      }
      updateTimerUI();
    };

    window.resetTimer = function() {
      pomodoro.isRunning = false;
      pomodoro.isExpanded = false;
      clearInterval(pomodoro.intervalId);
      
      pomodoro.timeLeft = pomodoro.durationMinutes * 60;

      // Return window to compact view or normal size
      applyTimerExpansion();
      applyCompactView();

      updateTimerUI();
    };

    window.toggleTimerExpansion = function() {
      if (!pomodoro.isRunning) return;
      pomodoro.isExpanded = !pomodoro.isExpanded;
      applyTimerExpansion();
    };

    window.applyTimerExpansion = function() {
      const expandBtn = document.getElementById('timer-expand-btn');
      const compactBtn = document.getElementById('compact-toggle-btn');

      if (!pomodoro.isRunning) {
        if (expandBtn) expandBtn.classList.add('hidden');
        if (compactBtn) compactBtn.classList.remove('hidden');
        document.body.classList.remove('compact-mode');
        return;
      }

      if (expandBtn) expandBtn.classList.remove('hidden');
      if (compactBtn) compactBtn.classList.add('hidden');

      if (pomodoro.isExpanded) {
        // Expand the UI
        document.body.classList.remove('compact-mode');
        document.body.classList.remove('compact-view');
        if (expandBtn) {
          expandBtn.innerHTML = '⤡';
          expandBtn.title = "Свернуть в таймер";
        }
        
        if (window.windowControls && window.windowControls.setNormal) {
          window.windowControls.setNormal();
        }
      } else {
        // Collapse the UI
        document.body.classList.add('compact-mode');
        document.body.classList.remove('compact-view');
        if (expandBtn) {
          expandBtn.innerHTML = '⤢';
          expandBtn.title = "Развернуть интерфейс";
        }
        if (window.windowControls && window.windowControls.setCompact) {
          window.windowControls.setCompact();
        }
      }
    };

    function updateTimerUI() {
      const mins = Math.floor(pomodoro.timeLeft / 60);
      const secs = pomodoro.timeLeft % 60;
      const timeStr = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;

      // Update timer texts
      document.querySelectorAll('.timer-display').forEach(el => {
        el.textContent = timeStr;
      });

      // Update play/pause button labels
      document.querySelectorAll('.timer-play-btn').forEach(el => {
        el.textContent = pomodoro.isRunning ? '⏸' : '▶';
      });
    }

    function triggerAlert() {
      // 1. Cozy green visual flash on the widget card (XP-Style Deep Blue Flash)
      const shell = document.getElementById('widget-shell');
      if (shell) {
        shell.style.borderColor = '#C93C22'; // Flash deep red
        setTimeout(() => {
          shell.style.borderColor = '#0054E3'; // Back to royal blue
        }, 1500);
      }
      
      // 2. Play subtle visual notification
      if (typeof Notification !== 'undefined') {
        if (Notification.permission === 'granted') {
          new Notification('Фокусировка', { body: 'Таймер Pomodoro завершен! Сделайте небольшой перерыв.' });
        } else if (Notification.permission !== 'denied') {
          Notification.requestPermission().then(permission => {
            if (permission === 'granted') {
              new Notification('Фокусировка', { body: 'Таймер Pomodoro завершен! Сделайте небольшой перерыв.' });
            }
          });
        }
      }
    }

    // --- Business Logic Tasks Actions ---

    window.addTask = function(text) {
      const trimmed = text.trim();
      if (!trimmed) return;

      const newTask = {
        id: 'task_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9),
        text: trimmed,
        notes: '',
        createdAt: new Date().toISOString()
      };

      if (state.activeTask) {
        // Move current active task to the front of parallel tasks list
        state.parallelTasks.unshift(state.activeTask);
      }
      state.activeTask = newTask;
      
      saveState();
      render();
    };

    // Business logic action: Switch / swap active task
    window.switchTask = function(id) {
      const index = state.parallelTasks.findIndex(t => t.id === id);
      if (index === -1) return;

      const selectedTask = state.parallelTasks[index];
      const prevActive = state.activeTask;

      if (prevActive) {
        // Swap task at the index with previous active
        state.parallelTasks[index] = prevActive;
      } else {
        // If there was no active task, just remove selected from parallel
        state.parallelTasks.splice(index, 1);
      }
      state.activeTask = selectedTask;

      saveState();
      render();
    };

    // Business logic action: Complete task
    window.completeTask = function(id) {
      let completedTask = null;

      if (state.activeTask && state.activeTask.id === id) {
        completedTask = state.activeTask;
        state.activeTask = null;
      } else {
        const index = state.parallelTasks.findIndex(t => t.id === id);
        if (index !== -1) {
          completedTask = state.parallelTasks[index];
          state.parallelTasks.splice(index, 1);
        }
      }

      if (completedTask) {
        const historyItem = {
          ...completedTask,
          completedAt: new Date().toISOString()
        };
        
        state.history.unshift(historyItem);
        // Limit history to 10 items
        if (state.history.length > 10) {
          state.history = state.history.slice(0, 10);
        }

        // If active task is completed while timer is running, stop and restore window
        if (state.activeTask === null) {
          pomodoro.isRunning = false;
          clearInterval(pomodoro.intervalId);
          pomodoro.timeLeft = pomodoro.durationMinutes * 60;
          document.body.classList.remove('compact-mode');
          applyTimerExpansion();
          applyCompactView();
        }

        saveState();
        render();
      }
    };

    // Handles form submission safely
    window.handleFormSubmit = function(e) {
      e.preventDefault();
      const input = document.getElementById('task-input');
      const text = input.value;
      if (text.trim()) {
        addTask(text);
        input.value = '';
        input.blur(); // Unfocus after submitting for better minimalist vibe
      }
    };

    // Rendering Engine
    function render() {
      // 1. Render Active Task Area
      const activeContainer = document.getElementById('active-task-container');
      if (state.activeTask) {
        const hasNotes = !!state.activeTask.notes;
        activeContainer.innerHTML = `
          <!-- Windows XP Group Box with thin etched borders -->
          <div class="border border-[#7F9DB9] bg-white rounded-[3px] p-3 text-center transition-all duration-300 cursor-move" style="box-shadow: inset 1px 1px 0 #ffffff;">
            <span class="text-[9px] font-bold text-[#003C74] tracking-wide uppercase block mb-1 select-none">Текущий фокус:</span>
            <p class="text-black text-xs font-semibold leading-relaxed break-words max-w-[240px] select-text">
              ${escapeHTML(state.activeTask.text)}
            </p>
            
            ${hasNotes ? `
              <!-- Yellow Sticky Note for Task Notes (XP Style Tooltip / Sticky Note) -->
              <div class="mt-2 p-1.5 bg-[#FFFFE1] border border-[#E1DFB8] rounded-[2px] text-left text-[10px] text-stone-700 max-h-[50px] overflow-y-auto cozy-scrollbar relative select-text hidden-in-compact no-drag" title="Заметки">
                <div class="absolute top-0.5 right-1.5 text-[8px] font-bold text-[#A4A37A] select-none uppercase tracking-wider">Заметка</div>
                <p class="whitespace-pre-wrap pr-5 font-mono leading-tight">${escapeHTML(state.activeTask.notes)}</p>
              </div>
            ` : ''}
            
            <div class="flex items-center justify-between w-full mt-3 px-0.5 select-none no-drag">
              <div class="flex items-center gap-1.5">
                <!-- XP-Style 3D Gray Button -->
                <button 
                  onclick="completeTask('${state.activeTask.id}')"
                  class="btn-scale xp-btn text-[10px] px-2.5 h-[21px] flex items-center justify-center cursor-pointer no-drag animate-none font-bold"
                  title="Завершить задачу"
                >
                  Готово
                </button>
                <!-- XP-Style 3D Gray Note Button -->
                <button 
                  onclick="openNotesModal('${state.activeTask.id}')"
                  class="btn-scale xp-btn w-[21px] h-[21px] flex items-center justify-center cursor-pointer no-drag animate-none text-[10px]"
                  title="Открыть блокнот"
                >
                  📝
                </button>
                <!-- XP-Style 3D Gray Edit Button -->
                <button 
                  onclick="openEditModal('${state.activeTask.id}')"
                  class="btn-scale xp-btn w-[21px] h-[21px] flex items-center justify-center cursor-pointer no-drag animate-none text-[10px]"
                  title="Редактировать задачу"
                >
                  ✏️
                </button>
              </div>
              
              <!-- Pomodoro Timer Pill (XP Console Style) -->
              <div class="flex items-center gap-1 text-[10px] bg-black border border-[#7F9DB9]/60 rounded-[3px] px-1.5 py-0.5 shadow-inner no-drag h-[21px]">
                <button onclick="toggleTimer()" class="timer-play-btn text-[#00FF00] hover:text-[#76ff9a] transition-colors cursor-pointer text-[7px] animate-none font-bold select-none" title="Старт/Пауза">▶</button>
                <span class="timer-display font-mono text-[#00FF00] font-bold select-all tracking-wider text-[10px]">25:00</span>
                <button onclick="resetTimer()" class="hover:text-white transition-colors cursor-pointer text-[9px] text-[#A62F1B] animate-none select-none" title="Сбросить">↺</button>
              </div>
            </div>
          </div>
        `;
      } else {
        // Coziest Minimal Empty State (XP Style)
        activeContainer.innerHTML = `
          <div class="border border-dashed border-[#7F9DB9] bg-white/40 rounded-[3px] p-4 text-center transition-all duration-300 cursor-move">
            <p class="text-stone-500 text-xs italic select-none">Внимание свободно</p>
            
            <!-- Pomodoro Timer Pill in Empty State -->
            <div class="inline-flex items-center gap-1.5 text-[10px] bg-black border border-[#7F9DB9]/60 rounded-[3px] px-2.5 py-0.5 shadow-inner mt-2.5 select-none no-drag">
              <button onclick="toggleTimer()" class="timer-play-btn text-[#00FF00] hover:text-[#76ff9a] transition-colors cursor-pointer text-[7px] animate-none font-bold" title="Старт/Пауза">▶</button>
              <span class="timer-display font-mono text-[#00FF00] font-bold tracking-wider">25:00</span>
              <button onclick="resetTimer()" class="hover:text-white transition-colors cursor-pointer text-[9px] text-[#A62F1B] animate-none" title="Сбросить">↺</button>
            </div>
          </div>
        `;
      }

      // 2. Render Parallel Tasks List
      const parallelContainer = document.getElementById('parallel-tasks-container');
      const parallelCount = document.getElementById('parallel-count');
      parallelCount.textContent = state.parallelTasks.length;

      if (state.parallelTasks.length === 0) {
        parallelContainer.innerHTML = `
          <div class="py-3 text-center select-none bg-white/60 border border-[#D2D2C9]/60 rounded-[2px]">
            <p class="text-[10px] text-stone-500 font-semibold italic">Очередь пуста</p>
          </div>
        `;
      } else {
        parallelContainer.innerHTML = state.parallelTasks.map(t => {
          const hasNotes = !!t.notes;
          return `
            <div class="group flex items-center justify-between py-1 px-1.5 hover:bg-[#3D7BF5]/15 border-b border-[#D2D2C9]/30 transition-colors duration-100">
              <button 
                onclick="switchTask('${t.id}')"
                class="flex-1 text-left text-xs font-semibold text-stone-800 hover:text-[#003C74] truncate pr-2 cursor-pointer transition-colors duration-100 animate-none flex items-center"
                title="Переключить фокус"
              >
                <span class="text-[#0054E3] mr-1 select-none font-bold shrink-0">•</span> 
                <span class="truncate">${escapeHTML(t.text)}</span>
                ${hasNotes ? `<span class="text-[8px] text-[#A4A37A] bg-[#FFFFE1] border border-[#E1DFB8]/60 px-0.5 rounded-[1px] ml-1 select-none shrink-0" title="${escapeHTML(t.notes)}">📝</span>` : ''}
              </button>
              <div class="flex items-center gap-1.5 shrink-0">
                <button 
                  onclick="openEditModal('${t.id}')"
                  class="opacity-0 group-hover:opacity-100 text-[#0054E3] hover:text-blue-800 transition-opacity duration-100 cursor-pointer text-[10px] px-0.5 font-bold animate-none"
                  title="Редактировать задачу"
                >
                  ✏️
                </button>
                <button 
                  onclick="openNotesModal('${t.id}')"
                  class="${hasNotes ? 'opacity-100' : 'opacity-0 group-hover:opacity-100'} text-[#0054E3] hover:text-blue-800 transition-opacity duration-100 cursor-pointer text-[10px] px-0.5 font-bold animate-none"
                  title="Редактировать заметку"
                >
                  📝
                </button>
                <button 
                  onclick="completeTask('${t.id}')"
                  class="opacity-0 group-hover:opacity-100 text-[#0054E3] hover:text-green-600 transition-opacity duration-100 cursor-pointer text-[10px] px-0.5 font-bold animate-none"
                  title="Завершить сразу"
                >
                  ✓
                </button>
              </div>
            </div>
          `;
        }).join('');
      }

      // 3. Render History / Archive List
      const historyList = document.getElementById('history-list');
      const historyCount = document.getElementById('history-count');
      historyCount.textContent = state.history.length;

      if (state.history.length === 0) {
        historyList.innerHTML = `
          <p class="text-[9px] text-[#003C74] italic text-center py-2 select-none">Архив пока пуст</p>
        `;
      } else {
        historyList.innerHTML = state.history.map(t => {
          const hasNotes = !!t.notes;
          return `
            <div class="flex items-center justify-between py-0.5 px-0.5 text-[10px] text-[#003C74] select-text">
              <span class="line-through truncate max-w-[210px] text-stone-500" title="${hasNotes ? 'Заметка: ' + escapeHTML(t.notes) : ''}">
                • ${escapeHTML(t.text)}
                ${hasNotes ? `<span class="text-[8px] text-[#A4A37A] bg-[#FFFFE1] border border-[#E1DFB8]/60 px-0.5 rounded-[1px] ml-0.5 select-none">📝</span>` : ''}
              </span>
              <span class="text-[8px] text-stone-500 select-none shrink-0 font-medium">${formatTime(t.completedAt)}</span>
            </div>
          `;
        }).join('');
      }

      // Update timer elements display instantly
      updateTimerUI();
    }

    // --- Notepad Modal Logic ---

    window.openNotesModal = function(taskId) {
      // Temporarily expand physical window and remove compact classes so the modal fits perfectly
      if (window.windowControls && window.windowControls.setNormal) {
        window.windowControls.setNormal();
      }
      document.body.classList.remove('compact-mode', 'compact-view');

      currentEditingTaskId = taskId;
      let task = null;
      if (state.activeTask && state.activeTask.id === taskId) {
        task = state.activeTask;
      } else {
        task = state.parallelTasks.find(t => t.id === taskId);
      }
      
      if (!task) return;
      
      const titleEl = document.getElementById('notes-modal-task-title');
      if (titleEl) {
        const dispText = task.text.length > 30 ? task.text.substring(0, 30) + '...' : task.text;
        titleEl.textContent = 'Задача: ' + dispText;
      }
      
      const textarea = document.getElementById('notes-textarea');
      if (textarea) {
        textarea.value = task.notes || '';
      }
      
      const modal = document.getElementById('notes-modal');
      if (modal) {
        modal.classList.remove('hidden');
      }
      
      // Focus textarea with a slightly longer timeout to allow Electron window to resize
      setTimeout(() => {
        if (textarea) textarea.focus();
      }, 100);
    };

    window.closeNotesModal = function(save) {
      if (save && currentEditingTaskId) {
        const textarea = document.getElementById('notes-textarea');
        const notesValue = textarea ? textarea.value : '';
        
        if (state.activeTask && state.activeTask.id === currentEditingTaskId) {
          state.activeTask.notes = notesValue;
        } else {
          const t = state.parallelTasks.find(t => t.id === currentEditingTaskId);
          if (t) {
            t.notes = notesValue;
          }
        }
        saveState();
        render();
      }
      
      const modal = document.getElementById('notes-modal');
      if (modal) {
        modal.classList.add('hidden');
      }
      currentEditingTaskId = null;

      // Restore original view mode and resize physical window
      if (pomodoro.isRunning) {
        applyTimerExpansion();
      } else if (viewState.isCompactView) {
        document.body.classList.add('compact-view');
        if (window.windowControls && window.windowControls.setCompactView) {
          window.windowControls.setCompactView();
        }
      } else {
        if (window.windowControls && window.windowControls.setNormal) {
          window.windowControls.setNormal();
        }
      }
    };

    window.saveNotes = function() {
      closeNotesModal(true);
    };

    // --- Edit Task Modal Logic ---
    let currentEditingTaskForTextId = null;

    window.openEditModal = function(taskId) {
      // Temporarily expand physical window and remove compact classes so the modal fits perfectly
      if (window.windowControls && window.windowControls.setNormal) {
        window.windowControls.setNormal();
      }
      document.body.classList.remove('compact-mode', 'compact-view');

      currentEditingTaskForTextId = taskId;
      let task = null;
      if (state.activeTask && state.activeTask.id === taskId) {
        task = state.activeTask;
      } else {
        task = state.parallelTasks.find(t => t.id === taskId);
      }
      
      if (!task) return;
      
      const inputEl = document.getElementById('edit-task-input');
      if (inputEl) {
        inputEl.value = task.text || '';
      }
      
      const modal = document.getElementById('edit-modal');
      if (modal) {
        modal.classList.remove('hidden');
      }
      
      setTimeout(() => {
        if (inputEl) inputEl.focus();
      }, 100);
    };

    window.closeEditModal = function(save) {
      if (save && currentEditingTaskForTextId) {
        const inputEl = document.getElementById('edit-task-input');
        const textValue = inputEl ? inputEl.value.trim() : '';
        
        if (textValue) {
          if (state.activeTask && state.activeTask.id === currentEditingTaskForTextId) {
            state.activeTask.text = textValue;
          } else {
            const t = state.parallelTasks.find(t => t.id === currentEditingTaskForTextId);
            if (t) {
              t.text = textValue;
            }
          }
          saveState();
          render();
        }
      }
      
      const modal = document.getElementById('edit-modal');
      if (modal) {
        modal.classList.add('hidden');
      }
      currentEditingTaskForTextId = null;

      // Restore original view mode and resize physical window
      if (pomodoro.isRunning) {
        applyTimerExpansion();
      } else if (viewState.isCompactView) {
        document.body.classList.add('compact-view');
        if (window.windowControls && window.windowControls.setCompactView) {
          window.windowControls.setCompactView();
        }
      } else {
        if (window.windowControls && window.windowControls.setNormal) {
          window.windowControls.setNormal();
        }
      }
    };

    window.saveTaskEdit = function() {
      closeEditModal(true);
    };

    // App Initialization
    document.addEventListener('DOMContentLoaded', () => {
      loadState();
      loadViewState();
      loadPomodoroSettings();
      render();
      
      // Apply saved Compact View state on start
      applyCompactView();

      // Load and apply saved opacity
      const savedOpacity = localStorage.getItem('focus_logbook_opacity') || '100';
      const slider = document.getElementById('opacity-slider');
      if (slider) {
        slider.value = savedOpacity;
      }
      adjustOpacity(savedOpacity);

      // Apply initial Pomodoro duration configuration inside Settings UI
      const durationInput = document.getElementById('timer-duration-input');
      if (durationInput) {
        durationInput.value = pomodoro.durationMinutes;
      }

      // Listen for Options & Archive details panel toggle to resize window
      const historyDetails = document.getElementById('history-details');
      if (historyDetails) {
        historyDetails.addEventListener('toggle', () => {
          if (historyDetails.open) {
            if (window.windowControls && window.windowControls.setExpanded) {
              window.windowControls.setExpanded();
            }
          } else {
            if (window.windowControls && window.windowControls.setNormal) {
              window.windowControls.setNormal();
            }
          }
        });
      }
    });
  </script>
</body>
</html>
